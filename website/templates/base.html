<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XRBridge{% block title_suffix %}{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080b10;
      --surface:   #0f1420;
      --surface2:  #151c2c;
      --border:    #1e2740;
      --border-hover: #2a3550;
      --accent:    #3b82f6;
      --accent-hover: #2563eb;
      --success:   #10b981;
      --success-bg: #0d2e1a;
      --warn:      #f59e0b;
      --warn-bg:   #2e1f0a;
      --danger:    #ef4444;
      --danger-bg: #1e0808;
      --text:      #e2e8f0;
      --text-secondary: #94a3b8;
      --muted:     #64748b;
      --input-bg:  #0a0f1a;
      --radius:    8px;
      --radius-lg: 12px;
      --font:      'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --mono:      'JetBrains Mono', 'Fira Code', 'SF Mono', 'Courier New', monospace;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* ── Top Navigation ── */
    .topnav {
      border-bottom: 1px solid var(--border);
      height: 64px;
      display: flex;
      align-items: center;
      padding: 0 24px;
      position: sticky;
      top: 0;
      background: rgba(8, 11, 16, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      z-index: 100;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-right: 32px;
    }
    .nav-logo {
      width: 26px; height: 26px;
      background: var(--accent);
      border-radius: 5px;
      display: flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 800; color: #fff;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .nav-brand {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .nav-sep {
      color: var(--border);
      font-size: 20px;
      font-weight: 300;
    }
    .nav-project {
      font-size: 14px;
      color: var(--text-secondary);
    }
    .nav-tabs {
      display: flex;
      height: 100%;
      gap: 0;
    }
    .nav-tab {
      display: flex;
      align-items: center;
      padding: 0 14px;
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      border-bottom: 2px solid transparent;
      transition: color 0.15s;
      position: relative;
    }
    .nav-tab:hover { color: var(--text-secondary); }
    .nav-tab.active {
      color: var(--text);
      border-bottom-color: var(--accent);
    }

    /* ── Page Layout ── */
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px 24px 80px;
    }
    .page-header {
      margin-bottom: 28px;
    }
    .page-header h2 {
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }
    .page-header p {
      color: var(--text-secondary);
      font-size: 14px;
      margin-top: 4px;
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--border-hover); }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .card-desc {
      color: var(--text-secondary);
      font-size: 13px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    /* ── Grid ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    @media(max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* ── Form Fields ── */
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    input[type=text], input[type=password], textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type=text]:focus,
    input[type=password]:focus,
    textarea:focus { border-color: var(--text-secondary); }
    textarea { min-height: 120px; resize: vertical; line-height: 1.6; }
    .field { margin-bottom: 16px; }
    .hint {
      margin-top: 5px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }
    .hint a { color: var(--accent); }
    .hint a:hover { text-decoration: underline; }
    .optional-tag {
      font-weight: 400;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 6px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font);
      line-height: 1.4;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-blue {
      background: var(--accent);
      color: #fff;
    }
    .btn-blue:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-success {
      background: var(--success);
      color: #000;
    }
    .btn-success:hover:not(:disabled) { opacity: 0.9; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }
    .btn-ghost:hover:not(:disabled) {
      border-color: var(--border-hover);
      color: var(--text);
    }
    .btn-danger {
      background: #2a0a0a;
      color: #f87171;
      border: 1px solid #4b1111;
    }
    .btn-danger:hover:not(:disabled) { background: #3d0d0d; }

    /* ── Status Badge ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
    }
    .badge-idle     { background: var(--surface2); border-color: var(--border); color: var(--muted); }
    .badge-deploying { background: #0c1e3b; border-color: #1e3a5f; color: #60a5fa; }
    .badge-done     { background: var(--success-bg); border-color: #134e35; color: #34d399; }
    .badge-error    { background: var(--danger-bg); border-color: #4b1111; color: #f87171; }
    .badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .badge-dot.pulse { animation: pulse 1.2s infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    /* ── Terminal / Log ── */
    .terminal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text-secondary);
      max-height: 340px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.7;
    }
    .terminal:empty { display: none; }
    .terminal .line-err  { color: #f87171; }
    .terminal .line-ok   { color: var(--success); }
    .terminal .line-head { color: var(--text); font-weight: 600; }

    /* ── Endpoint Box ── */
    .endpoint-box {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .endpoint-label {
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }
    .endpoint-url {
      font-family: var(--mono);
      font-size: 12px;
      color: #60a5fa;
      flex: 1;
      word-break: break-all;
    }
    .copy-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text-secondary);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      font-family: var(--font);
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--border-hover); color: var(--text); }

    /* ── Inline messages ── */
    .inline-error {
      background: var(--danger-bg);
      border: 1px solid #4b1111;
      border-radius: 6px;
      color: #f87171;
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }
    .inline-success {
      background: var(--success-bg);
      border: 1px solid #134e35;
      border-radius: 6px;
      color: var(--success);
      font-size: 13px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    /* ── Save confirmation ── */
    .save-confirm {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; color: var(--success);
      opacity: 0; transition: opacity 0.3s;
      margin-left: 10px;
    }
    .save-confirm.show { opacity: 1; }

    /* ── Divider ── */
    .divider {
      border-top: 1px solid var(--border);
      margin: 24px 0;
    }

    /* ── Hidden ── */
    .hidden { display: none !important; }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Responsive ── */
    @media(max-width: 640px) {
      .topnav { padding: 0 16px; }
      .nav-left { margin-right: 16px; }
      .nav-project, .nav-sep { display: none; }
      .page { padding: 24px 16px 60px; }
    }

    {% block extra_css %}{% endblock %}
  </style>
</head>
<body>

<nav class="topnav">
  <div class="nav-left">
    <div class="nav-logo">XR</div>
    <span class="nav-brand">XRBridge</span>
    <span class="nav-sep">/</span>
    <span class="nav-project">SocialSenseAR</span>
  </div>
  <div class="nav-tabs">
    <a href="/" class="nav-tab {% if active_tab == 'overview' %}active{% endif %}">Overview</a>
    <a href="/deployments" class="nav-tab {% if active_tab == 'deployments' %}active{% endif %}">Deployments</a>
    <a href="/settings" class="nav-tab {% if active_tab == 'settings' %}active{% endif %}">Settings</a>
  </div>
</nav>

<div class="page">
  {% block content %}{% endblock %}
</div>

<script>
  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function copyToClipboard(text, btn) {
    navigator.clipboard.writeText(text).then(() => {
      const orig = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = orig, 1500);
    });
  }
  function flashConfirm(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2500);
  }
  function timeAgo(iso) {
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const s = Math.floor(diff / 1000);
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.floor(h / 24);
    return d + 'd ago';
  }
  function formatDuration(start, end) {
    if (!start || !end) return '';
    const ms = new Date(end) - new Date(start);
    const s = Math.floor(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    const rem = s % 60;
    return m + 'm ' + rem + 's';
  }
  {% block extra_js %}{% endblock %}
</script>
</body>
</html>
