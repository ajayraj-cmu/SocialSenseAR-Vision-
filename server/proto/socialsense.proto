syntax = "proto3";
package socialsense;

// ============================================================
// CLIENT -> SERVER
// ============================================================

message ClientMessage {
  uint64 frame_id = 1;
  double timestamp_ms = 2;
  oneof payload {
    FramePayload frame = 3;
    AudioPayload audio = 4;
    ControlPayload control = 5;
  }
}

message FramePayload {
  bytes jpeg_data = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 quality = 4;
}

message AudioPayload {
  bytes pcm16_data = 1;
  uint32 sample_rate = 2;
  uint32 num_samples = 3;
}

message ControlPayload {
  string command = 1;
}

// ============================================================
// SERVER -> CLIENT
// ============================================================

message ServerMessage {
  uint64 frame_id = 1;
  double timestamp_ms = 2;
  double processing_time_ms = 3;

  // Frame ID that masks actually correspond to (SAM processes older frames due to latency)
  uint64 masks_frame_id = 5;

  // True when SAM decoder produced new masks (false = cached/unchanged masks)
  bool masks_updated = 6;

  // True when all effects were explicitly cleared (distinguishes "clear" from "target not detected")
  bool effects_cleared = 7;

  // All segmented objects in the scene
  repeated SceneSegment segments = 10;

  // Conversation state (from audio pipeline)
  ConversationState conversation = 20;

  // Server performance metrics
  PerformanceMetrics metrics = 30;

  // Phase 2: keypoint overlays (pose, hands, face landmarks)
  repeated KeypointOverlay keypoints = 40;

  // Phase 2: depth map overlay (depth colormap JPEG)
  DepthOverlay depth = 41;
}

// ============================================================
// PHASE 2: KEYPOINTS & DEPTH
// ============================================================

message KeypointOverlay {
  string model_id = 1;                  // "mediapipe_pose", "yolo_pose", "sapiens"
  repeated KeypointGroup groups = 2;
}

message KeypointGroup {
  string label = 1;                     // "body", "face", "left_hand", "right_hand"
  repeated Keypoint points = 2;
  repeated int32 skeleton_edges = 3;    // flat pairs of indices into points[]
}

message Keypoint {
  float x = 1;                          // normalized 0-1
  float y = 2;                          // normalized 0-1
  float visibility = 3;                 // 0-1
  string name = 4;                      // "nose", "left_shoulder", etc.
}

message DepthOverlay {
  string model_id = 1;                  // "depth-anything", "sapiens"
  bytes depth_rgb = 2;                  // JPEG-encoded colormap (RGB)
  int32 width = 3;
  int32 height = 4;
  float near_m = 5;                     // nearest depth value (raw units)
  float far_m = 6;                      // farthest depth value (raw units)
}

message SceneSegment {
  string label = 1;              // "desk", "ceiling_light", "person"
  string asset_class = 2;        // "furniture", "lighting", "person", "screens", "structural", "objects"
  float confidence = 3;

  BoundingBox bbox = 4;          // normalized 0-1
  bytes rle_mask = 5;            // RLE-encoded binary mask
  uint32 mask_width = 6;
  uint32 mask_height = 7;

  float center_x = 8;           // centroid normalized 0-1
  float center_y = 9;

  string track_id = 10;         // stable ID across frames

  // Only populated for segments with label "person" and visible face
  EmotionResult emotion = 15;

  // Voice agent effect metadata (applied per-object)
  EffectMetadata effect = 16;
}

message BoundingBox {
  float x_min = 1;
  float y_min = 2;
  float x_max = 3;
  float y_max = 4;
}

message EmotionResult {
  string primary_emotion = 1;    // "happy", "sad", "angry", "neutral"
  string display_label = 2;     // "Happy", "Frustrated", "Anxious"
  string emoji = 3;             // unicode emoji
  float confidence = 4;
}

message ConversationState {
  string summary = 1;           // GPT-4o-mini summary, max ~80 chars
  string vibe = 2;              // "engaged", "bored", "upset", "excited", "neutral"
  string recent_utterance = 3;  // last transcribed speech
  string question = 4;          // detected question
  bool is_other_speaking = 5;
  bool is_user_speaking = 6;
  SocialCue social_cue = 10;

  // Voice agent state
  VoiceAgentState voice_agent = 20;
}

message SocialCue {
  string cue_type = 1;          // "sarcasm", "rhetorical", "frustration", etc.
  string icon = 2;              // emoji
  string message = 3;           // display text
  float confidence = 4;
  double timestamp = 5;
}

message PerformanceMetrics {
  float fastsam_ms = 1;
  float labeling_ms = 2;
  float emotion_ms = 3;
  float audio_ms = 4;
  float total_ms = 5;
  uint32 segment_count = 6;
}

// ============================================================
// VOICE AGENT — Effects & Scene Understanding
// ============================================================

message EffectMetadata {
  string effect_type = 1;       // "blur", "dim", "pixelate", "highlight", "outline", "color", "none"
  float intensity = 2;          // 0.0-1.0
  string color_hex = 3;         // hex color for outline/highlight/color effects (e.g., "#FF0000")
  map<string, string> params = 4;  // additional effect parameters
}

message VoiceAgentState {
  bool listening = 1;           // waiting for wake word
  bool recording = 2;           // recording utterance after wake word
  string partial_transcript = 3;  // current utterance being assembled
  string last_command = 4;      // last executed command text
  string last_response = 5;     // agent's response/status message
  double last_command_time = 6; // timestamp of last command execution

  // Active full-screen filter (applied globally, not per-object)
  FullScreenFilter full_screen_filter = 10;
}

message FullScreenFilter {
  string filter_type = 1;       // "dim", "warm", "cool", "night", "grayscale", "color", "none"
  float intensity = 2;          // 0.0-1.0
  string color_hex = 3;         // hex color if filter_type is "color" (e.g., "#0000FF")
}
